api:
  enabled: true
  address: 0.0.0.0:8686

sources:
  gen_in:
    type: http_server
    address: 0.0.0.0:8080
    framing:
      method: newline_delimited   # NDJSON: одно событие на строку
    decoding:
      codec: json

  vector_metrics:
    type: internal_metrics

  probe_in:
    type: http_server
    address: 0.0.0.0:8081
    framing:
      method: newline_delimited
    decoding:
      codec: json

transforms:
  normalize:
    type: remap
    inputs: [gen_in]
    source: |
      del(.source_type)
      del(.path)
      del(.timestamp)
      .collected_at = format_timestamp!(now(), format: "%Y-%m-%dT%H:%M:%S%.3fZ")

sinks:
  to_kafka:
    type: kafka
    inputs: [normalize]
    bootstrap_servers: kafka:19092
    topic: logs-raw
    key_field: host
    encoding:
      codec: json
    buffer:
      type: memory
      max_events: 10000
      when_full: block

  discard:
    type: blackhole
    inputs: [ probe_in ]
    print_interval_secs: 0

  metrics_out:
    type: prometheus_exporter
    inputs: [vector_metrics]
    address: 0.0.0.0:9598