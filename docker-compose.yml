services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "siem-core-kraft-cluster-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_USER: siem
      CLICKHOUSE_PASSWORD: siem
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    mem_limit: 3g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "siem", "--password", "siem", "--query", "SELECT 1"]
      interval: 5s
      retries: 12

  vector-collector:
    image: timberio/vector:0.41.1-debian
    container_name: vector-collector
    volumes:
      - ./vector/collector.yaml:/etc/vector/vector.yaml:ro
    ports:
      - "8080:8080"   # приём событий от генератора
      - "8686:8686"   # API (vector top)
      - "9598:9598"   # метрики
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m

  vector-shipper:
    image: timberio/vector:0.41.1-debian
    container_name: vector-shipper
    volumes:
      - ./vector/shipper.yaml:/etc/vector/vector.yaml:ro
    ports:
      - "8687:8686"   # API: на ноутбуке 8687, т.к. 8686 занят collector'ом
      - "9599:9598"   # метрики: аналогично
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    mem_limit: 512m

volumes:
  kafka_data:
  ch_data:
